### NVIDIA ###
#env = LIBVA_DRIVER_NAME,nvidia
#env = XDG_SESSION_TYPE,wayland
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = WLR_NO_HARDWARE_CURSORS,1
#env = NVD_BACKEND,direct

### INTEL ###
env = WLR_DRM_DEVICES,/dev/dri/card1

cursor {
    no_hardware_cursors = true
}

render {
    direct_scanout = false
}

### DISPLAY / DPI ###
xwayland {
    force_zero_scaling = true
}
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = XFT_DPI,96
env = QT_FONT_DPI,96
env = QT_QPA_PLATFORMTHEME,qt6ct

### CURSOR ###
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

### MONITORS ###
monitor = HDMI-A-1,1920x1080@120,0x0,1
monitor = DP-1,disabled

### PROGRAMS ###
$terminal    = foot
$fileManager = pcmanfm
$menu        = fuzzel

### AUTOSTART ###
exec-once = waybar
exec-once = hyprpaper
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/lxqt-policykit-agent
exec-once = mako
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = sleep 2 && ~/.config/hypr/autostart-shader.sh
exec-once = kbuildsycoca6 --noincremental

### GENERAL ###
general {
    col.active_border    = rgba(cba6f7ff)
    gaps_in              = 0
    gaps_out             = 0
    border_size          = 2
    resize_on_border     = false
    allow_tearing        = true
    layout               = master
}

### DECORATION ###
decoration {
    rounding        = 10
    rounding_power  = 2
    active_opacity  = 1  
    inactive_opacity = 1

shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

### ANIMATIONS ###
animations {
    enabled = false
    animation = workspaces, 0
}

### LAYOUTS ###
dwindle {
    pseudotile     = false
    preserve_split = true
    force_split    = 2
}

master {
    new_status  = master
    new_on_top  = true
    mfact       = 0.40
    orientation = left
}

### MISC ###
misc {
    disable_hyprland_logo         	= true
    disable_hyprland_qtutils_check	= true
    force_default_wallpaper       	= -1
    mouse_move_enables_dpms       	= false
    vfr				  	= false
}

### INPUT ###
input {
    kb_layout  = us,gr
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

### KEYBINDINGS ###
$mainMod = SUPER

# Core
bind = $mainMod,       return, exec,            $terminal
bind = $mainMod,       Q,      killactive,
bind = $mainMod,       M,      exit,
bind = $mainMod,       E,      exec,            $fileManager
bind = $mainMod,       V,      togglefloating,
bind = $mainMod,       S,      exec,            $menu
bind = $mainMod,       P,      pseudo,
bind = $mainMod,       J,      togglesplit,
bind = $mainMod,       F,      fullscreen,      1
bind = $mainMod,       L,      exec,            hyprlock
bind = $mainMod,       B,      exec,            bluetooth-manager.sh
bind = ALT,            TAB,    cyclenext,
bind = $mainMod,       R,      exec,            /home/nora/.local/bin/waybar-reload.sh
bind = , Caps_Lock,            exec, 		sleep 0.1 && pkill -RTMIN+1 waybar
bind = $mainMod,       W,      exec, 		pkill -SIGUSR1 waybar
bind = $mainMod	SHIFT, R,      exec,		hyprctl reload
bind = SUPER, TAB, layoutmsg, swapwithmaster

# Toggle between vibrance and night shader
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/toggle-shader.sh

# Screenshot
bind = $mainMod SHIFT, S,      exec,            grim -g "$(slurp)" - | wl-copy

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Workspaces
bind = $mainMod,       1, workspace,       1
bind = $mainMod,       2, workspace,       2
bind = $mainMod,       3, workspace,       3
bind = $mainMod,       4, workspace,       4
bind = $mainMod,       5, workspace,       5
bind = $mainMod,       6, workspace,       6
bind = $mainMod,       7, workspace,       7
bind = $mainMod,       8, workspace,       8
bind = $mainMod,       9, workspace,       9
bind = $mainMod,       0, workspace,       10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media (requires playerctl)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

### WINDOW RULES ###

# Ignore maximize requests
windowrule = suppressevent maximize, class:.*

# Fix XWayland dragging
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0


windowrulev2 = float, class:^(swayimg)$
